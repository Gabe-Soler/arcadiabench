[package]
name = "arcadiabench-python"
version = "1.0.1"
edition = "2024"
description = "Python bindings for ArcadiaBench (the native module of the arcadiabench package)."
license = "MIT"
repository = "https://github.com/Gabe-Soler/arcadiabench"
publish = false

# Its own workspace: the root crate's `cargo fmt`, `clippy` and `test` never
# build a Python extension. Build it with maturin (see README.md).
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
arcadiabench = { path = ".." }
arcadia-protocol = { git = "https://github.com/Gabe-Soler/arcadia-protocol", tag = "v1.0.0" }
# abi3: one wheel for CPython 3.9 and later.
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
serde = "1.0.229"
serde_json = "1.0.154"
