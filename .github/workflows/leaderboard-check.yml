name: Leaderboard check

# Exercises what the leaderboard's runner is made of, with code from this
# repository only: the sandbox every run's coordinator is put in, the entry
# runner, and the tools. The runner itself (leaderboard.yml) is started by
# hand and runs code from outside; this is the automatic test of its parts.
on:
  push:
    paths:
      - "leaderboard/tools/**"
      - "leaderboard/config.json"
      - "site/tools/**"
      - ".github/workflows/leaderboard*.yml"
  pull_request:
    paths:
      - "leaderboard/tools/**"
      - "leaderboard/config.json"
      - "site/tools/**"
      - ".github/workflows/leaderboard*.yml"

permissions: {}

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      B: target/release/arcadiabench
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin arcadiabench --bin baseline-greedy --bin null-coordinator

      - name: An image of the greedy baseline, and three that misbehave
        run: |
          mkdir -p ctx/greedy ctx/probe ctx/hang ctx/dice
          cp target/release/baseline-greedy ctx/greedy/coordinator
          docker build -q -f leaderboard/tools/prebuilt.Dockerfile -t entry-greedy ctx/greedy
          # Says what the sandbox lets it do, then stops.
          printf '%s\n' 'FROM ubuntu:24.04' 'ENTRYPOINT ["sh", "-c", "id -u; touch /probe 2>/dev/null && echo wrote-root; touch /tmp/probe && echo wrote-tmp; (getent hosts github.com >/dev/null 2>&1 || timeout 3 bash -c \"echo > /dev/tcp/1.1.1.1/443\" 2>/dev/null) && echo network; echo done"]' > ctx/probe/Dockerfile
          docker build -q -t entry-probe ctx/probe
          # Never answers.
          printf '%s\n' 'FROM ubuntu:24.04' 'ENTRYPOINT ["sleep", "infinity"]' > ctx/hang/Dockerfile
          docker build -q -t entry-hang ctx/hang
          # Not deterministic: each run is the greedy baseline or the null
          # coordinator, by the clock.
          cp target/release/baseline-greedy ctx/dice/greedy
          cp target/release/null-coordinator ctx/dice/null
          printf '%s\n' 'FROM ubuntu:24.04' 'COPY greedy null /usr/local/bin/' 'USER 65534:65534' 'ENTRYPOINT ["sh", "-c", "if [ $(( $(date +%s%N) / 1000000 % 2 )) = 0 ]; then exec /usr/local/bin/greedy; else exec /usr/local/bin/null; fi"]' > ctx/dice/Dockerfile
          docker build -q -t entry-dice ctx/dice

      - name: The sandbox gives a coordinator the protocol and nothing else
        run: |
          out=$(leaderboard/tools/sandbox.sh entry-probe </dev/null)
          echo "$out"
          test "$(echo "$out" | head -1)" = 65534
          echo "$out" | grep -qx wrote-tmp
          echo "$out" | grep -qx done
          if echo "$out" | grep -q wrote-root; then echo "it wrote to the root file system"; exit 1; fi
          if echo "$out" | grep -q network; then echo "it reached the network"; exit 1; fi

      - name: The same runs, in the sandbox and outside it
        run: |
          $B suite --catalog 1.1 --seeds 1-2 --jobs 3 --out direct -- target/release/baseline-greedy >/dev/null
          $B suite --catalog 1.1 --seeds 1-2 --jobs 3 --out boxed -- leaderboard/tools/sandbox.sh entry-greedy >/dev/null
          diff -r direct boxed
          echo "36 runs: byte for byte the same"

      - name: An entry's results come out of the entry runner
        run: |
          ARCADIABENCH=$B leaderboard/tools/run-entry.sh leaderboard/entries/baseline-greedy/1.1.0/entry.json entry-greedy out 1-2 twice
          node -e '
            const report = require("./out/report.json"), runs = require("./out/runs.json");
            const assert = require("node:assert/strict");
            assert.equal(report.scorecards.length, 24);
            assert.ok(report.scorecards.every((c) => c.coordinator.name === "baseline-greedy" && c.seeds.join() === "1,2"));
            assert.equal(Object.keys(runs.scenarios).length, 4);
            console.log("24 scorecards, 4 nominal scenarios");'
          test -z "$(docker ps -q --filter label=arcadia-run)"

      - name: A round, from its plan to its files
        run: |
          # A copy of the leaderboard where the greedy baseline is the one
          # entry, accepted, and a round has three seeds.
          mkdir -p sim && cp -R leaderboard sim/leaderboard
          node -e '
            const fs = require("fs"), base = "sim/leaderboard";
            const cfg = JSON.parse(fs.readFileSync(base + "/config.json"));
            cfg.round_seeds = 3;
            fs.writeFileSync(base + "/config.json", JSON.stringify(cfg));
            for (const id of fs.readdirSync(base + "/entries")) if (id !== "baseline-greedy") fs.rmSync(base + "/entries/" + id, { recursive: true });
            fs.rmSync(base + "/rounds", { recursive: true, force: true });
            const file = base + "/entries/baseline-greedy/1.1.0/entry.json", entry = JSON.parse(fs.readFileSync(file));
            entry.image_digest ??= "sha256:" + "0".repeat(64);
            fs.writeFileSync(file, JSON.stringify(entry));'
          commit=$(git rev-parse HEAD)
          node site/tools/plan.mjs round round-1 "$commit" sim > plan.txt
          seeds=$(grep '^seeds=' plan.txt | cut -d= -f2-)
          plan=$(grep '^entries=' plan.txt | cut -d= -f2-)
          test "$seeds" = "$(node site/tools/round-seeds.mjs "$commit" 3)"
          ARCADIABENCH=$B leaderboard/tools/run-entry.sh sim/leaderboard/entries/baseline-greedy/1.1.0/entry.json entry-greedy artifacts/results-baseline-greedy-1.1.0 "$seeds" twice
          cp -R sim sim-wrong
          node site/tools/publish-results.mjs round --plan "$plan" --artifacts artifacts --tag round-1 --commit "$commit" --root sim --out round-out
          grep -q "Ranked: baseline-greedy 1.1.0" round-out/message.txt
          test -f sim/leaderboard/entries/baseline-greedy/1.1.0/round-1/report.json
          node -e '
            const round = require("./sim/leaderboard/rounds/round-1.json");
            const assert = require("node:assert/strict");
            assert.equal(round.seeds.join(), process.argv[1]);
            assert.deepEqual(round.entries.map((e) => e.id), ["baseline-greedy"]);
            assert.deepEqual(round.not_ranked, []);
            console.log("round 1 of one entry on seeds", process.argv[1]);' "$seeds"
          # Results on other seeds than the round's are not the round's.
          mkdir -p wrong && cp -R out wrong/results-baseline-greedy-1.1.0
          if node site/tools/publish-results.mjs round --plan "$plan" --artifacts wrong --tag round-1 --commit "$commit" --root sim-wrong --out wrong-out; then
            echo "results on the public seeds were taken for a round's"; exit 1
          fi
          grep -q "not on the seeds asked for" wrong-out/summary.md

      - name: A baseline built from its own Dockerfile gives the same runs
        run: |
          # As the runner builds an entry: with whatever compiler the
          # Dockerfile brings, not this job's.
          docker build -q -f leaderboard/tools/dockerfiles/baseline-greedy.Dockerfile -t entry-built .
          $B suite --catalog 1.1 --seeds 1-2 --jobs 3 --out built -- leaderboard/tools/sandbox.sh entry-built >/dev/null
          diff -r direct built
          echo "36 runs: byte for byte the same"

      - name: A coordinator that hangs is killed, and its container with it
        run: |
          if ARCADIA_RUN_BUDGET_S=20 $B run --catalog 1.1 --decision-timeout 3 -- leaderboard/tools/sandbox.sh entry-hang; then
            echo "a coordinator that never answers finished a run"; exit 1
          fi
          # The simulator has killed the wrapper; the watchdog kills the container.
          docker ps --filter label=arcadia-run --format '{{.Names}}'
          for i in $(seq 1 30); do
            [ -z "$(docker ps -q --filter label=arcadia-run)" ] && break
            sleep 1
          done
          test -z "$(docker ps -q --filter label=arcadia-run)"

      - name: An entry that is not deterministic is not given results
        run: |
          if ARCADIA_RUN_BUDGET_S=60 ARCADIABENCH=$B leaderboard/tools/run-entry.sh leaderboard/entries/baseline-random/1.1.0/entry.json entry-dice out-dice 1-3 twice; then
            echo "an entry that is not deterministic was given results"; exit 1
          fi
          test ! -e out-dice/report.json
          test -z "$(docker ps -q --filter label=arcadia-run)"
