name: Leaderboard

# Accepts entries for the leaderboard: builds each one's image, runs it on
# the public seeds and keeps the image and the results. Started by hand, by a
# maintainer, from the Actions tab; docs/leaderboard.md has the rules.
#
# With "pending" (the default) it takes every entry that has not been
# accepted yet, one job each, and their results come back on one branch.
#
# Submitted code is untrusted. No job both runs it and holds anything worth
# stealing:
#
#   plan     reads the entry files and checks every value in them
#            (site/tools/plan.mjs). Runs no submitted code.
#   build    builds an entry's image from its pinned commit. No permissions.
#   run      runs the image in the sandbox (leaderboard/tools/sandbox.sh): no
#            network, nothing mounted, no permissions.
#   publish  runs no submitted code. It checks the results it is handed
#            (site/tools/publish-results.mjs), pushes the images to the
#            registry and pushes a branch with the results for a maintainer
#            to open as a pull request.
#
# Everything an entry file says reaches git and docker as environment
# variables, never as text pasted into a command.
#
# The results are committed as the maintainer who started the run, under
# their GitHub account's own no-reply address. The repository variables
# LEADERBOARD_GIT_NAME and LEADERBOARD_GIT_EMAIL replace that when set.
on:
  workflow_dispatch:
    inputs:
      entry:
        description: 'The entry to accept, as ID/VERSION, or "pending" for every entry not accepted yet'
        required: true
        default: pending
        type: string

permissions: {}

concurrency:
  group: leaderboard-accept
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      entries: ${{ steps.plan.outputs.entries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Which entries
        id: plan
        env:
          ENTRY: ${{ inputs.entry }}
        run: node site/tools/plan.mjs accept "$ENTRY" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build ${{ matrix.entry.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.entries) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch the source at its pinned commit
        env:
          REPOSITORY: ${{ matrix.entry.repository }}
          COMMIT: ${{ matrix.entry.commit }}
        run: |
          git init -q src
          git -C src remote add origin "$REPOSITORY"
          git -C src -c protocol.file.allow=never fetch -q --depth 1 --no-tags --no-recurse-submodules origin "$COMMIT"
          git -C src checkout -q --detach FETCH_HEAD
          test "$(git -C src rev-parse HEAD)" = "$COMMIT"
      - name: Build the image
        env:
          DOCKERFILE: ${{ matrix.entry.dockerfile }}
        run: |
          test -f "src/$DOCKERFILE"
          timeout 45m docker build -f "src/$DOCKERFILE" -t entry:built src
          docker save entry:built | gzip > image.tar.gz
          limit=$(node -e 'console.log(require("./leaderboard/config.json").image_limit_mb)')
          size=$(( $(stat -c %s image.tar.gz) / 1048576 ))
          echo "image: $size MB compressed (limit $limit MB)"
          test "$size" -le "$limit"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-${{ matrix.entry.key }}
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  run:
    needs: [plan, build]
    # One entry that does not build does not stop the others.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: run ${{ matrix.entry.key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.entries) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Which simulator
        id: cfg
        run: echo "simulator=$(node -e 'console.log(require("./leaderboard/config.json").simulator)')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.cfg.outputs.simulator }}
          path: simulator
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Build the simulator from its release tag
        run: cargo build --release --locked --bin arcadiabench --manifest-path simulator/Cargo.toml
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: image-${{ matrix.entry.key }}
      - name: Load the image
        run: gunzip -c image.tar.gz | docker load
      - name: Run the entry on the public seeds, twice
        env:
          DIR: ${{ matrix.entry.dir }}
          ARCADIABENCH: simulator/target/release/arcadiabench
        run: |
          seeds=$(node -e 'console.log(require("./leaderboard/config.json").public_seeds)')
          leaderboard/tools/run-entry.sh "$DIR/entry.json" entry:built results "$seeds" twice
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: results-${{ matrix.entry.key }}
          path: results/
          retention-days: 7

  publish:
    needs: [plan, build, run]
    # Entries whose runs came back are accepted even if another's did not.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      ENTRIES: ${{ needs.plan.outputs.entries }}
      GIT_NAME: ${{ vars.LEADERBOARD_GIT_NAME || github.actor }}
      GIT_EMAIL: ${{ vars.LEADERBOARD_GIT_EMAIL || format('{0}+{1}@users.noreply.github.com', github.actor_id, github.actor) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
      - name: Push the images to the registry
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          mkdir -p digests
          node -e 'for (const e of JSON.parse(process.env.ENTRIES)) console.log(e.key, e.image_name, e.image_tag)' > entries.txt
          while read -r key name tag; do
            # Only an entry whose runs came back has its image kept.
            if [ ! -f "artifacts/results-$key/report.json" ] || [ ! -f "artifacts/image-$key/image.tar.gz" ]; then continue; fi
            image="ghcr.io/$owner/$name"
            gunzip -c "artifacts/image-$key/image.tar.gz" | docker load -q
            docker tag entry:built "$image:$tag"
            docker push -q "$image:$tag"
            docker inspect --format '{{index .RepoDigests 0}}' "$image:$tag" | sed 's/.*@//' > "digests/$key"
            grep -Eqx 'sha256:[0-9a-f]{64}' "digests/$key"
            docker image rm -f entry:built "$image:$tag" >/dev/null
            echo "image=$image" >> "$GITHUB_OUTPUT"
          done < entries.txt
      - name: Check and write the results
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          status=0
          node site/tools/publish-results.mjs accept --plan "$ENTRIES" --artifacts artifacts --digests digests --image "${IMAGE:-none}" --out out || status=$?
          if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$status" != 0 ]; then exit "$status"; fi
          node site/tools/build-board.mjs /tmp/board.json
      - name: Push a branch with the results
        run: |
          branch="leaderboard/accepted-$GITHUB_RUN_NUMBER"
          git switch -q -c "$branch"
          git add leaderboard/entries
          git -c user.name="$GIT_NAME" -c user.email="$GIT_EMAIL" commit -q -F out/message.txt
          git push -q --force origin "$branch"
          {
            echo
            echo "The results are on the branch \`$branch\`. Open the pull request:"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch"
          } >> "$GITHUB_STEP_SUMMARY"
