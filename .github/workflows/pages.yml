name: Viewer Pages

# Publishes the site to GitHub Pages: on every push to main that changes
# what it serves, and by hand from the Actions tab. The repository's Pages
# source must be set to GitHub Actions.
#
# The site keeps repository paths: the front page (index.html and site/), the
# replay viewer (viewer/, without its tests), results/, and the leaderboard's
# entries with the board built from them (leaderboard/). So a replay under
# results/ opens with
#   https://<owner>.github.io/<repo>/viewer/?log=../results/v1.1/replays/<run>.jsonl.gz
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "site/**"
      - "viewer/**"
      - "results/**"
      - "leaderboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test viewer/test/
      - run: node --test site/test/
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R site _site/site
          rm -rf _site/site/test _site/site/tools
          cp -R viewer _site/viewer
          rm -rf _site/viewer/test
          if [ -d results ]; then cp -R results _site/results; fi
          cp -R leaderboard _site/leaderboard
          node site/tools/build-board.mjs _site/leaderboard/board.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
