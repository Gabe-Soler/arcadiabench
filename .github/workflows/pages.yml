name: Viewer Pages

# Publishes the replay viewer to GitHub Pages: on every push to main that
# changes what the site serves, and by hand from the Actions tab. The
# repository's Pages source must be set to GitHub Actions.
#
# The site keeps repository paths: viewer/ (without its tests) and results/
# when present, so a replay under results/ opens with
#   https://<owner>.github.io/<repo>/viewer/?log=../results/v1.0/replays/<run>.jsonl.gz
on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "results/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test viewer/test/
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R viewer _site/viewer
          rm -rf _site/viewer/test
          if [ -d results ]; then cp -R results _site/results; fi
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>ArcadiaBench replay viewer</title>
          <meta http-equiv="refresh" content="0; url=viewer/">
          <p><a href="viewer/">Open the ArcadiaBench replay viewer</a></p>
          HTML
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
