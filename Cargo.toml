[package]
name = "arcadiabench"
version = "1.0.1"
edition = "2024"
description = "An open, seeded benchmark for coordinating robot crews building on Mars."
license = "MIT"
repository = "https://github.com/Gabe-Soler/arcadiabench"
default-run = "arcadiabench"
# What the crate is built from, and so all that the Python package's source
# distribution takes from this directory: not the results, the viewer, the
# tests or the Python bindings, which are a separate crate with its own
# workspace.
include = ["/src/", "/schemas/", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
# ArcadiaBench meets coordinators only through the shared spec; `validate` lets it
# reject anything a coordinator sends that does not match the schemas.
arcadia-protocol = { git = "https://github.com/Gabe-Soler/arcadia-protocol", tag = "v1.0.0", features = ["validate"] }
# Saved run logs are gzipped; the pure-Rust backend only.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
libm = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
# Validates scorecards against `schemas/scorecard.schema.json` (the version arcadia-protocol uses).
jsonschema = { version = "0.60.2", default-features = false }
