[package]
name = "arcadiabench"
version = "0.1.0"
edition = "2024"
description = "An open, seeded benchmark for coordinating robot crews building on Mars."
license = "MIT"
repository = "https://github.com/Gabe-Soler/ArcadiaBench"
default-run = "arcadiabench"

[dependencies]
# ArcadiaBench meets coordinators only through the shared spec; `validate` lets it
# reject anything a coordinator sends that does not match the schemas.
arcadia-protocol = { git = "https://github.com/Gabe-Soler/arcadia-protocol", tag = "v0.1.0", features = ["validate"] }
serde_json = "1.0.154"
